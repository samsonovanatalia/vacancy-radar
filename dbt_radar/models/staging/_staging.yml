# Описание моделей слоя staging и тесты к ним.
#
# Тест в dbt — это не тест кода, а проверка САМИХ ДАННЫХ.
# При каждом запуске dbt выполняет её и падает, если условие нарушено.
# Именно эти три строки в вакансиях называют "data quality".

version: 2

models:
  - name: stg_vacancies
    description: >
      Вакансии из всех источников, приведённые к единому виду.
      Одна строка = одна вакансия в одном источнике (дубли между
      источниками на этом слое ещё НЕ склеены — это задача marts).

    columns:
      - name: vacancy_key
        description: "Ключ вакансии: source + source_id."
        tests:
          - unique        # значений-дублей быть не должно
          - not_null      # пустых значений быть не должно

      - name: source
        description: "Откуда пришла вакансия."
        tests:
          - accepted_values:
              # Список разрешённых значений. Если завтра появится источник,
              # о котором мы не знаем, тест упадёт — и это правильно.
              arguments:
                values: ['arbeitnow', 'adzuna', 'remoteok', 'remotive', 'telegram', 'manfred']

      - name: title
        tests:
          - not_null

      - name: description
        description: "Описание как пришло из источника. У arbeitnow и части других — HTML."

      - name: description_clean
        description: >
          Описание без HTML-тегов и сущностей, со схлопнутыми пробелами и
          без рекламного хвоста arbeitnow. По нему ищутся навыки, и его
          получает языковая модель. Что чистка сработала, проверяет тест
          tests/assert_description_clean_has_no_html.sql.

      - name: posted_at
        description: "Когда вакансия опубликована в источнике."

      - name: description_best
        description: >
          Лучший доступный текст вакансии: page_text_clean из stg_vacancy_pages,
          если полный текст со страницы есть, иначе description_clean.

      - name: description_source
        description: "Откуда взят description_best: page — со страницы вакансии, api — из API."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['page', 'api']

  - name: stg_manfred_facts
    description: >
      Структурные поля Manfred, которых нет у других источников. Одна строка =
      одна вакансия Manfred (самая свежая загрузка). Витрина берёт их вместо
      ответа модели там, где они заполнены.
    columns:
      - name: vacancy_key
        description: "Ключ вакансии: 'manfred:' + id оффера."
        tests:
          - unique
          - not_null
      - name: required_languages
        description: >
          Требуемые языки из поля languages: записи {language, level}, код в
          нижнем регистре — та же форма, что у ответа модели. Пустой массив —
          компания языки не указала, а не «язык не нужен».
      - name: remote_percentage
        description: "Доля удалённой работы, 0–100, как в источнике."
      - name: location_cities
        description: >
          Города из location по отдельности. Пустой массив — места работы нет,
          у Manfred так пишут полностью удалённые вакансии.
      - name: salary_currency
        description: >
          Валюта зарплаты кодом ISO 4217: в raw она знаком («€» → EUR).
          Незнакомый знак — null.
      - name: salary_period
        description: "Всегда 'year': salaryFrom и salaryTo у Manfred — годовые суммы."
      - name: last_seen_at
        description: >
          Когда вакансию последний раз видели в списке офферов: максимум
          ingested_at по вакансии. Список отдаёт только активные офферы,
          поэтому это признак живости вместо даты публикации, которой
          у Manfred нет.
        tests:
          - not_null
      - name: first_seen_at
        description: >
          Когда вакансию впервые увидели в списке офферов: минимум
          ingested_at по вакансии. Замена даты публикации для недельной оси
          дашборда. Сбор начат 2026-09-20 — у более старых офферов это день
          начала сбора, а не публикации.
        tests:
          - not_null

  - name: stg_vacancy_pages
    description: >
      Страницы вакансий, которые скачивает fetch/adzuna_pages.py. Одна строка =
      одна вакансия: из нескольких попыток скачать страницу берётся последняя
      по fetched_at.
    columns:
      - name: vacancy_key
        description: "Ключ вакансии, тот же, что в stg_vacancies."
        tests:
          # unique сторожит не только эту модель: stg_vacancies и
          # mart_vacancies_scored делают left join по vacancy_key, и дубль тут
          # размножил бы строки там.
          - unique
          - not_null
      - name: http_status
        description: "Код ответа последней попытки; null — ответа не было (сетевая ошибка, пропуск /land/ad/)."
      - name: is_dead
        description: "true, если последняя попытка вернула 404. Нет ответа — false: не проверили, а не сняли."
      - name: last_checked_at
        description: >
          Время последней успешной проверки — по всем попыткам, не только по
          последней. Успешная — код 200 с текстом страницы или код 404.
          null — успешных проверок не было.
      - name: page_text_clean
        description: >
          Полный текст со страницы, очищенный макросом clean_html_text — так же,
          как description_clean. Только у живой страницы (код 200 и разметка
          JobPosting), иначе null.

  - name: stg_enrichment
    description: >
      Факты о вакансии от языковой модели (Gemini). Одна строка = одна
      вакансия: из нескольких ответов по одной вакансии берётся самый свежий.
    columns:
      - name: vacancy_key
        description: "Ключ вакансии, тот же, что в stg_vacancies."
        tests:
          # unique здесь сторожит не только эту модель: mart_vacancies_scored
          # делает left join по vacancy_key, и дубль тут размножил бы строки там.
          - unique
          - not_null
      - name: application_deadline
        description: "Дата из ответа модели; null, если даты нет или она не разобралась."
      - name: required_languages
        description: >
          Языки, которые вакансия называет требованием (промпт v5): список
          записей language — код ISO 639-1, level — уровень, как написан в
          вакансии, или null. Упоминание вскользь и «будет плюсом» не в счёт.
          Пустой список — требований нет или ответ старой версии промпта.
      - name: residency_years_required
        description: >
          Сколько лет проживания в стране требует вакансия, числом (промпт v5).
          null — такого требования нет или ответ старой версии промпта.

  - name: stg_digest_sent
    description: >
      Вакансии, у которых уже есть исход отправки в Telegram: доставлена или
      недоставляемая. Одна строка = одна вакансия: если доставка была, берётся
      первая доставка, иначе первая запись undeliverable.
    columns:
      - name: vacancy_key
        description: "Ключ вакансии, тот же, что в stg_vacancies."
        tests:
          # unique сторожит и очередь: mart_digest_queue сверяется с этой
          # моделью, и дубль здесь не должен ничего размножить.
          - unique
          - not_null
      - name: status
        description: >
          sent — Telegram подтвердил доставку; undeliverable — Telegram отказал
          с кодом 400, повторять бессмысленно. null в raw (строки, записанные
          до появления колонки) читается как sent.
        tests:
          - not_null
          # Бот запишет что-то третье — тест упадёт, а не молча примет.
          - accepted_values:
              arguments:
                values: ['sent', 'undeliverable']
      - name: sent_at
        description: "Когда записан выбранный исход: время доставки или отказа Telegram."
        tests:
          - not_null

# Сингулярные тесты — отдельные запросы из папки tests. Их строгость задаётся
# здесь, по имени файла, а не в самом запросе.
data_tests:
  - name: assert_description_clean_has_no_html
    description: >
      В description_clean не осталось HTML-тегов, сущностей и рекламного
      хвоста arbeitnow.
    config:
      # Строгость: 1–10 строк — предупреждение, больше 10 — ошибка.
      #
      # Почему не ошибка с первой строки. Остаток разметки — косметика, а не
      # порча данных: навыки по тексту ищутся, модель его читает, в дайджест
      # вакансия попадает. А упавший тест в первом dbt build останавливает
      # весь collect.yml, и день остаётся без дайджеста. Так было 16.09.2026:
      # одна сущность &rsquo; в одном описании из ~9000.
      #
      # Почему не просто предупреждение. Одна-две строки — это новая сущность
      # или новый оборванный тег в каком-то источнике, их чинят в макросе
      # clean_html_text в рабочем порядке. Больше 10 — это уже сломанная
      # чистка или сменившийся формат источника, и тогда в витрины поедет
      # грязный текст массово. Такое должно остановить конвейер.
      # 10 — примерно 0.1% описаний: с запасом выше случайных одиночек.
      #
      # Как это записать. severity: warn здесь не подходит: при нём dbt не
      # проверяет error_if вообще, и тест никогда не станет ошибкой.
      # Поэтому severity: error, а пороги — в warn_if и error_if: dbt
      # сначала сверяет число строк с error_if, потом с warn_if.
      #
      # Предупреждение в логе легко не заметить: WARN в итоговой строке
      # dbt build — повод посмотреть строки тестом вручную.
      severity: error
      warn_if: ">0"
      error_if: ">10"
