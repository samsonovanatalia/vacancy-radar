# Здесь мы описываем dbt источники — таблицы, которые НЕ создаёт dbt,
# а которые кто-то положил до него (в нашем случае — коллекторы).
#
# Зачем это нужно:
#   1. В моделях вместо жёсткого имени таблицы пишем {{ source('raw', 'arbeitnow') }},
#      и dbt сам понимает, что модель зависит от этой таблицы.
#   2. Сюда же вешается freshness — проверка "а данные вообще свежие?".

version: 2

sources:
  - name: raw
    description: "Сырые вакансии, как пришли из источников. Не изменяются."
    database: "{{ env_var('BQ_PROJECT', 'my-project') }}"   # id проекта в Google Cloud
    schema: raw                                             # датасет в BigQuery

    # freshness: если самая свежая строка старше 36 часов — предупредить,
    # старше 72 часов — уронить с ошибкой. Так мы узнаем, что утренний сбор
    # сломался, до того как увидим пустой дашборд.
    config:
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
      loaded_at_field: ingested_at

    tables:
      - name: arbeitnow
        description: "Открытый job-board, ориентирован на Европу."

      - name: remoteok
        description: "Job-board только про удалённую работу, вакансии со всего мира."
