# Здесь мы описываем dbt источники — таблицы, которые НЕ создаёт dbt,
# а которые кто-то положил до него (в нашем случае — коллекторы).
#
# Зачем это нужно:
#   1. В моделях вместо жёсткого имени таблицы пишем {{ source('raw', 'arbeitnow') }},
#      и dbt сам понимает, что модель зависит от этой таблицы.
#   2. Сюда же вешается freshness — проверка "а данные вообще свежие?".

version: 2

sources:
  - name: raw
    description: "Сырые вакансии, как пришли из источников. Не изменяются."
    database: "{{ env_var('BQ_PROJECT', 'my-project') }}"   # id проекта в Google Cloud
    schema: raw                                             # датасет в BigQuery

    # freshness: если самая свежая строка старше 36 часов — предупредить,
    # старше 72 часов — уронить с ошибкой. Так мы узнаем, что утренний сбор
    # сломался, до того как увидим пустой дашборд.
    config:
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
      loaded_at_field: ingested_at

    tables:
      - name: arbeitnow
        description: "Открытый job-board, ориентирован на Европу."

      - name: remoteok
        description: "Job-board только про удалённую работу, вакансии со всего мира."

      - name: remotive
        description: >
          Ещё один job-board про удалёнку. Отдаёт зарплату свободным текстом
          и тип занятости одной строкой — приводим к общему виду в staging.

      - name: adzuna
        description: >
          Агрегатор вакансий с ключом доступа. В отличие от остальных, это не
          общий список, а поиск: собираем 4 фразы × 3 города (Барселона,
          Мадрид, Амстердам) за последние 3 дня. Служебные поля query,
          salary_is_predicted и category_label живут только здесь, в raw.

      - name: llm_enrichment
        description: >
          Ответы Gemini по вакансиям из подборки: суть, стек, режим работы,
          город, требование к резидентству, зарплата. Пишет enrich/with_gemini.py,
          одна строка = один ответ модели. На одну вакансию бывает несколько
          строк (например, после смены промпта) — последнюю выбирает stg_enrichment.
        config:
          # Проверку свежести от источника raw отключаем для этой таблицы.
          # Во-первых, у неё нет колонки ingested_at. Во-вторых, новых строк
          # может честно не быть несколько дней — если в подборке не появилось
          # новых вакансий, и это не поломка.
          freshness: null

      - name: vacancy_pages
        description: >
          Страницы вакансий Adzuna, которые скачивает fetch/adzuna_pages.py.
          Одна строка = одна попытка скачать страницу: код ответа, конечный
          адрес, есть ли разметка JobPosting и — только у живой страницы (код
          200 и разметка) — описание из JSON-LD как есть, с HTML. На вакансию
          бывает несколько попыток (403 сегодня, 200 завтра) — последнюю
          выбирает stg_vacancy_pages.
        config:
          # Свежесть не проверяем, как и у llm_enrichment: колонки ingested_at
          # нет, а новых строк честно может не быть — кандидатов на скачивание
          # бывает ноль, и это не поломка.
          freshness: null
