version: 2

models:
  - name: mart_skill_demand
    description: >
      Спрос на навыки для дашборда. Одна строка = неделя × навык × роль.
      Население — весь рынок дата-ролей (is_market_vacancy), не подборка.
      Навыки — из поля stack ответа модели, написания склеены макросом
      normalize_skill. Строится из mart_vacancies_scored, поэтому это
      скользящий срез за 30 дней, а не история.
    columns:
      - name: skill_demand_key
        description: "Ключ строки: week|skill|role_type."
        tests:
          - unique
          - not_null
      - name: week
        description: >
          Неделя с понедельника (isoweek) по дате публикации; у Manfred —
          по первому появлению в списке (stg_manfred_facts.first_seen_at).
        tests:
          - not_null
      - name: skill
        description: "Навык из stack после normalize_skill, в нижнем регистре."
        tests:
          - not_null
      - name: role_type
        tests:
          - not_null
      - name: vacancies_count
        description: "Уникальных рыночных вакансий этой роли за неделю, где модель нашла навык."
        tests:
          - not_null
      - name: spain_vacancies_count
        description: "Из них в Барселоне или Испании (is_barcelona или location_fit = spain)."
        tests:
          - not_null
      - name: remote_vacancies_count
        description: "Из них полностью удалённых (work_mode = remote или location_fit = remote)."
        tests:
          - not_null
      - name: role_vacancies_count
        description: >
          Знаменатель: всех рыночных вакансий этой роли за неделю, со stack и
          без. Одинаков у всех навыков внутри неделя × роль.
        tests:
          - not_null
      - name: role_vacancies_with_stack
        description: >
          Знаменатель для доли навыка: из них вакансий, у которых есть stack.
          Доля = vacancies_count / role_vacancies_with_stack. Разница с
          role_vacancies_count — непокрытая моделью часть рынка.
        tests:
          - not_null

  - name: mart_salary
    description: >
      Зарплатные вилки для дашборда. Одна строка = роль × грейд × город ×
      период оплаты × валюта. Население — рынок (is_market_vacancy), только
      вакансии с хотя бы одной границей вилки. Вилка — salary_*_best: поле
      источника главнее ответа модели. Годовые и месячные суммы к одной
      шкале не приводятся (в Испании 12 или 14 выплат). null в городе,
      периоде или валюте — отдельная группа «не указано». Срез за 30 дней.
      ДЛЯ БЫСТРОГО ЧТЕНИЯ ГЛАЗАМИ, НЕ ДЛЯ ДАШБОРДА: медианы этой таблицы
      нельзя складывать и усреднять — медиана роли не собирается из медиан
      ячеек роль × город. Для графиков — mart_salary_facts, медиану на
      нужном уровне считает Looker. Счётчик vacancies_count складывается.
    columns:
      - name: salary_key
        description: "Ключ строки: роль|грейд|город|период|валюта, null заменён на «(не указан)»."
        tests:
          - unique
          - not_null
      - name: role_type
        tests:
          - not_null
      - name: seniority
        description: "Грейд по заголовку (наша регулярка), не ответ модели."
        tests:
          - not_null
      - name: city
        description: "location_city из mart_vacancies_scored: город источника, иначе модели. null — не указан."
      - name: salary_period
        description: "Период оплаты: year / month / day / hour. null — не указан."
      - name: salary_currency
        description: "Валюта, ISO 4217. null — не указана."
      - name: vacancies_count
        description: "Вакансий с хотя бы одной границей вилки."
        tests:
          - not_null
      - name: salary_min_median
        description: "Медиана нижней границы — по вакансиям, где она указана. Точная (percentile_cont)."
      - name: salary_max_median
        description: "Медиана верхней границы — по вакансиям, где она указана."
      - name: salary_min_min
        description: "Самая низкая нижняя граница в группе."
      - name: salary_max_max
        description: "Самая высокая верхняя граница в группе."

  - name: mart_salary_facts
    description: >
      Факты для дашборда зарплат: одна строка = одна рыночная вакансия
      (is_market_vacancy) хотя бы с одной границей вилки. Без агрегатов —
      медиану и другие агрегаты на любом уровне считает Looker. Вилка —
      salary_*_best: поле источника главнее ответа модели. Периоды к одной
      шкале не приводятся. Срез за 30 дней.
    columns:
      - name: vacancy_key
        tests:
          - unique
          - not_null
      - name: role_type
        tests:
          - not_null
      - name: seniority
        description: "Грейд по заголовку (наша регулярка), не ответ модели."
        tests:
          - not_null
      - name: city
        description: "location_city: город источника, иначе модели; написания склеены normalize_city. null — не указан."
      - name: country
        description: "Страна по ответу модели, ISO 3166-1 alpha-2. null — не обогащена или страна не указана."
      - name: work_mode
        description: "onsite / hybrid / remote / unclear: поле источника (Manfred), иначе модели."
      - name: source
        tests:
          - not_null
      - name: week
        description: >
          Неделя с понедельника (isoweek) по дате публикации; у Manfred — по
          первому появлению в списке. То же правило, что в mart_skill_demand.
        tests:
          - not_null
      - name: salary_from
        description: "Нижняя граница вилки. null — указана только верхняя."
      - name: salary_to
        description: "Верхняя граница вилки. null — указана только нижняя."
      - name: salary_period
        description: "year / month / day / hour. null — не указан."
      - name: salary_currency
        description: "ISO 4217. null — не указана."
      - name: url
        tests:
          - not_null

  - name: mart_vacancies_scored
    description: >
      Все свежие вакансии с признаками, причиной исключения и баллом
      релевантности. Свежая — опубликована не раньше 30 дней назад, а у
      Manfred (даты публикации нет) — вакансию видели в списке офферов не
      раньше 2 дней назад. Одна строка = одна вакансия. Ничего не
      выбрасывает: отсеянные строки остаются с заполненным excluded_reason,
      чтобы решения фильтра можно было сверить с ручной разметкой.
    columns:
      - name: vacancy_key
        description: "Ключ вакансии: source + ':' + source_id. Грейн витрины."
        tests:
          # unique здесь сторожит грейн: если в модель когда-нибудь добавят
          # join, который размножит строки, тест упадёт на сборке.
          - not_null
          - unique
      - name: title
        tests:
          - not_null
      - name: posted_at
        description: >
          Дата публикации, не старше 30 дней на момент сборки. У Manfred сюда
          попадает updatedAt — он бывает многолетней давности, и свежесть
          таких вакансий считается по src_last_seen_at.
        tests:
          - not_null
      - name: role_type
        description: "analytics_engineer / product_analyst / analyst / data_engineer / other — по заголовку."
      - name: title_key
        description: >
          Ключ заголовка для дедупа: заголовок целиком в нижнем регистре, из
          которого вычищен только шум — маркеры пола, города и страны, ставки,
          лишняя пунктуация. Специализация («- Finance», «(CRM)») остаётся,
          поэтому такие вакансии не склеиваются. Правило —
          macros/normalize_job_title.sql.
      - name: description_clean
        description: "Описание из API без HTML, из stg_vacancies. По нему считается is_english."
      - name: description_best
        description: >
          Лучший доступный текст из stg_vacancies: полный со страницы вакансии,
          если он есть, иначе description_clean. Его отправляет в модель
          enrich/with_gemini.py.
      - name: description_source
        description: "Откуда взят description_best: page — со страницы вакансии, api — из API."
      - name: seniority
        description: "lead / senior / junior / mid — по заголовку. lead и junior исключаются."
      - name: is_english
        description: >
          false, если английских служебных слов меньше 5 на 100 слов в первых
          2000 символах чистого описания (description_clean) или в заголовке
          есть (m/w/d), (m/f/d), (w/m/d).
      - name: is_russian
        description: >
          true, если не меньше половины слов в первых 2000 символах
          description_clean содержат кириллицу.
      - name: is_awaiting_language_check
        description: >
          Объявление не на английском и не на русском (not is_english and not
          is_russian), и модель ещё не проверила его: нет ответа промпта v5
          или новее. Такая вакансия придерживается как awaiting_language_check,
          пока её не обогатят; после этого за язык решает
          foreign_language_required.
      - name: location_fit
        description: "spain / remote / other — по location и is_remote. Только для балла, не исключает."
      - name: is_agency
        description: "Компания похожа на кадровое агентство из списка. На балл не влияет."
      - name: is_non_data_title
        description: >
          В заголовке слова продаж, работы с клиентами или найма: account executive,
          sales, business development, account manager, customer success, recruiter.
          Такая вакансия исключается как non_data_role.
      - name: work_mode
        description: >
          Итоговый формат работы: из структурного поля источника (у Manfred —
          remote_percentage: 100 → remote, 0 → onsite, между → hybrid), а где
          его нет — llm_work_mode. Его читают правила fits_location и
          wrong_location.
      - name: location_city
        description: >
          Итоговый город: первый из списка городов источника (Manfred), а где
          списка нет — llm_location_city.
      - name: required_languages
        description: >
          Итоговые требуемые языки: из поля languages источника (Manfred), если
          оно не пустое, иначе llm_required_languages. Пустой languages —
          «компания не указала», и тогда решает модель.
      - name: has_language_check
        description: >
          Язык проверен: источник назвал требуемые языки или есть ответ модели
          v5+. false у вакансии не на английском и не на русском — она
          придерживается как awaiting_language_check.
      - name: src_last_seen_at
        description: >
          Когда вакансию Manfred последний раз видели в списке офферов. У
          остальных источников null. Заменяет дату публикации в окне
          свежести: у Manfred её нет.
      - name: has_source_facts
        description: "true, если у вакансии есть структурные поля источника (stg_manfred_facts); иначе null."
      - name: salary_min_best
        description: >
          Итоговая нижняя граница вилки: из полей источника, а если их нет —
          найденная моделью в тексте. Вилка берётся целиком с одной стороны,
          не по числу.
      - name: salary_max_best
        description: "Итоговая верхняя граница вилки, из того же источника, что salary_min_best."
      - name: salary_currency_best
        description: >
          Валюта кодом ISO 4217: из источника (Manfred), иначе из ответа
          модели. У остальных источников валюты нет вовсе, поэтому здесь
          coalesce, а не «вместе с вилкой».
      - name: salary_period_best
        description: "year / month / day / hour: из источника (у Manfred всегда year), иначе из ответа модели."
      - name: src_remote_percentage
        description: "Доля удалённой работы из источника, 0–100 (только Manfred)."
      - name: src_required_languages
        description: "Требуемые языки из источника как есть (только Manfred); пусто — не указаны."
      - name: llm_work_mode
        description: "Режим работы по ответу модели: onsite / hybrid / remote / unclear. null — не обогащена."
      - name: llm_location_city
        description: "Город по ответу модели."
      - name: llm_residency_requirement
        description: "Дословное требование жить или иметь право работать в конкретной стране."
      - name: fits_location
        description: >
          Подходит ли локация по фактам от модели: yes / no / unclear.
          null — обогащения ещё нет, балл считается без этого признака.
      - name: llm_required_languages
        description: >
          Языки, которые вакансия называет требованием, по ответу модели
          (промпт v5): записи language (ISO 639-1) и level. Пусто — требований
          нет или вакансия не обогащена.
      - name: llm_residency_years_required
        description: >
          Сколько лет проживания в стране требует вакансия, по ответу модели
          (промпт v5). null — требования нет или вакансия не обогащена.
      - name: is_foreign_language_required
        description: >
          В required_languages есть хоть один язык с кодом, кроме en и ru.
          Уровень не учитывается, английский и русский не учитываются вовсе.
          false — таких языков нет или вакансия не обогащена. Такая вакансия
          исключается как foreign_language_required.
      - name: is_residency_too_long
        description: >
          llm_residency_years_required больше 1. false — год и меньше, требования
          нет или вакансия не обогащена. Такая вакансия исключается как
          residency_too_long.
      - name: is_residency_outside_spain
        description: >
          В требовании к резидентству от модели названа конкретная страна, и
          это не Испания: нет ни Испании, ни ЕС / Европы. Фраза без названной
          страны («territorio nacional», «country of your choice») — false:
          это незнание, а не запрет. false и когда требования нет или вакансия
          не обогащена. Такая вакансия исключается как residency_outside_spain.
        tests:
          - not_null
      - name: excluded_reason
        description: >
          Первое сработавшее правило: wrong_seniority →
          duplicate (company_core + title_key) → irrelevant_role →
          dead (страница вакансии отдала 404, см. stg_vacancy_pages) →
          non_data_role (заголовок продаж, работы с клиентами или найма) →
          awaiting_language_check (не на английском и не на русском, модель
          ещё не проверила, см. is_awaiting_language_check) →
          foreign_language_required (модель нашла требование языка, кроме
          английского и русского, см. is_foreign_language_required) →
          residency_too_long (требуют больше года проживания в стране, см.
          is_residency_too_long) → wrong_location (не Барселона и не полная
          удалёнка, см. is_wrong_location) → residency_outside_spain
          (требуют жить в другой стране, см. is_residency_outside_spain).
          null — вакансия проходит в подборку.
      - name: is_barcelona
        description: >
          Барселона по двум полям сразу: llm_location_city из обогащения и
          location из источника. location только подтверждает Барселону и
          никогда не опровергает — это свободный текст шести API, где
          «Spain» и «Worldwide» не значат «не Барселона».
      - name: is_wrong_location
        description: >
          Вакансия не в Барселоне и не полная удалёнка. true, только когда
          есть положительное свидетельство: известен город (и он не
          Барселона) или известен формат работы (onsite/hybrid). Если не
          знаем ни города, ни формата — false: не исключаем за незнание.
      - name: relevance_score
        description: >
          Эвристика релевантности: за роль +4 analytics_engineer, +3 analyst,
          +2 product_analyst, +1 data_engineer; +2 spain / +1 remote
          по location_fit, +3 за fits_location yes (за no штрафа нет —
          неподходящую локацию исключают правила), −2 за senior,
          +1 за указанную зарплату.
      - name: dedup_rank
        description: >
          Номер копии в группе дублей (компания + ядро заголовка). 1 —
          победитель, остальные исключаются как duplicate.
      - name: is_dead
        description: >
          Страница вакансии отдала 404 (stg_vacancy_pages). null — страницу
          не скачивали: у источников, кроме Adzuna, её не бывает вовсе.
      - name: is_market_vacancy
        description: >
          Вакансия входит в население дашборда рынка: дата-роль
          (role_type не other), заголовок про данные, одна копия на вакансию
          (dedup_rank = 1). Грейд, язык, локация и отправка в дайджест не
          важны — дашборд отвечает «чего хочет рынок», а не «куда я могу
          откликнуться». Снятые вакансии тоже входят: на рынке они были.
        tests:
          - not_null
      - name: is_enrichment_candidate
        description: >
          Рыночная вакансия (is_market_vacancy), которая ещё жива (не dead).
          С 2026-09-24 грейд кандидатов не отсекает: lead и junior нужны
          дашборду рынка. Правила, которые зависят от модели или языка
          (awaiting_language_check, foreign_language_required,
          residency_too_long, wrong_location), кандидатов не отсекают.
          По этому флагу fetch/adzuna_pages.py качает страницы.
        tests:
          # null здесь — вакансия тихо выпала бы и из обогащения, и из
          # догрузки страниц. Лучше пусть упадёт сборка.
          - not_null
      - name: is_ready_for_enrichment
        description: >
          Кандидат, у которого есть полный текст: у Adzuna — только при
          description_source = 'page', у остальных источников — всегда.
          По этому флагу enrich/with_gemini.py отправляет вакансию модели.
        tests:
          - not_null

  - name: mart_enrichment_candidates
    description: >
      Кандидаты на обогащение и на догрузку страниц: вакансии из
      mart_vacancies_scored с is_enrichment_candidate. Одна строка = одна
      вакансия. Своих правил не содержит — только выбирает строки и колонки,
      которые читают fetch/adzuna_pages.py (все строки Adzuna) и
      enrich/with_gemini.py (строки с is_ready_for_enrichment).
    columns:
      - name: vacancy_key
        description: "Ключ вакансии: source + ':' + source_id. Грейн витрины."
        tests:
          - not_null
          - unique
      - name: is_ready_for_enrichment
        description: "Есть полный текст — можно отправлять модели."
        tests:
          - not_null

  - name: mart_digest_queue
    description: >
      Очередь на отправку в Telegram: все подходящие вакансии, у которых ещё нет
      исхода отправки. Одна строка = одна вакансия в очереди. Отбор:
      excluded_reason is null; relevance_score > 0; вакансия не помечена мёртвой
      (stg_vacancy_pages.is_dead); жива — у Adzuna последняя успешная проверка
      страницы не старше 3 дней, у остальных источников дата публикации не
      старше 30 дней; бот её не отправлял и не признавал недоставляемой
      (stg_digest_sent). Число строк не ограничено: сколько отправить за раз,
      решает бот (MAX_PER_RUN в notify/telegram.py), остальное ждёт следующего
      запуска. Необогащённая вакансия остаётся, поля модели у неё пустые.
    columns:
      - name: vacancy_key
        description: "Ключ вакансии: source + ':' + source_id. Грейн витрины."
        tests:
          - not_null
          - unique
      - name: queue_position
        description: >
          Номер в очереди, 1 — отправить первой. Порядок: relevance_score по
          убыванию, при равном балле обогащённые выше, потом posted_at по
          убыванию, потом vacancy_key.
        tests:
          # unique: два одинаковых номера — и порядок отправки между ними
          # решал бы случай.
          - not_null
          - unique
      - name: posted_at
        description: "Дата публикации."
      - name: liveness_basis
        description: >
          На чём основано решение, что вакансия жива: checked — страницу
          успешно проверили не раньше 3 дней назад; listed_in_source — вакансию
          видели в списке офферов Manfred не раньше 2 дней назад;
          assumed_by_date — проверять нечем, вакансия опубликована не раньше
          30 дней назад.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['checked', 'listed_in_source', 'assumed_by_date']
      - name: title
        tests:
          - not_null
      - name: company_name
        tests:
          - not_null
      - name: location_city
        description: "Город по ответу модели. null — не обогащена или город не указан."
      - name: location_country
        description: "Страна по ответу модели, ISO 3166-1 alpha-2."
      - name: work_mode
        description: "Режим работы по ответу модели: onsite / hybrid / remote / unclear."
      - name: seniority
        description: "Уровень по ответу модели: по заголовку и требуемому опыту. Не путать с seniority по заголовку в mart_vacancies_scored."
      - name: stack
        description: "Технологии и инструменты, названные в тексте, по ответу модели."
      - name: salary_min
        description: >
          Зарплата из витрины: вилка из полей источника, а если их нет —
          найденная моделью в тексте. Прогноз Adzuna сюда не попадает.
      - name: residency_requirement
        description: "Дословное требование жить или иметь право работать в конкретной стране."
      - name: summary
        description: "Суть вакансии в 2–3 предложениях от модели."
      - name: language
        description: >
          Язык объявления, ISO 639-1, по ответу модели. Если не en, бот пишет
          строку «Объявление на …». null — вакансия не обогащена.
      - name: url
        description: "Ссылка на вакансию в источнике."
        tests:
          - not_null
      - name: relevance_score
        description: "Балл из mart_vacancies_scored."
      - name: description_source
        description: "По какому тексту судим о вакансии: page — полный со страницы, api — из API."
      - name: prompt_version
        description: "Версия промпта ответа модели. null — вакансия не обогащена."

  - name: mart_vacancies_for_me
    description: >
      Подборка вакансий под мой профиль. Из неё скачиваются страницы Adzuna,
      а очередь на отправку в Telegram (mart_digest_queue) строится по тем же
      правилам. Одна строка = одна вакансия. View поверх mart_vacancies_scored:
      только строки, где excluded_reason is null.
    columns:
      - name: vacancy_key
        description: "Ключ вакансии: source + ':' + source_id. Грейн витрины."
        tests:
          # not_null и unique вместе означают «это первичный ключ».
          # unique здесь не формальность: он ловит поломку дедупликации
          # в stg_vacancies — если qualify перестанет работать, тест упадёт
          # тут, а не всплывёт задвоенным сообщением в телеграме.
          - not_null
          - unique
      - name: title
        description: "Заголовок вакансии как в источнике."
        tests:
          - not_null
      - name: posted_at
        description: "Дата публикации. Не старше 30 дней на момент сборки."
        tests:
          - not_null
      - name: relevance_score
        description: "Балл из mart_vacancies_scored. Чем больше, тем выше в подборке."
