# Отправка дайджеста в Telegram по расписанию: первые MAX_PER_RUN вакансий
# очереди mart_digest_queue (notify/telegram.py). Очередь собирает collect.yml
# в 06:17 UTC, отправка — в 08:09 UTC (10:09 в Барселоне летом).
#
# Отдельный workflow, а не последний шаг collect.yml: так сбор и отправка
# падают и перезапускаются независимо. Упал сбор — дайджест всё равно уйдёт
# по вчерашней очереди или скажет «новых вакансий нет»; упала отправка — её
# можно перезапустить руками, не пересобирая всё с утра.
#
# Секреты этого workflow (Settings → Secrets and variables → Actions):
#   GCP_SA_KEY          — ключ сервисного аккаунта Google Cloud
#   BQ_PROJECT          — id проекта в Google Cloud
#   TELEGRAM_BOT_TOKEN  — токен бота
#   TELEGRAM_CHAT_ID    — чат, куда слать
# BigQuery нужен и здесь: бот читает очередь и пишет исходы в raw.digest_sent.
# Добавляешь шаг, которому нужен новый ключ, — заведи секрет, допиши его в
# этот список и в env шага.

name: digest

on:
  # Расписание задаётся в UTC. Барселона летом UTC+2, зимой UTC+1:
  # "9 8 * * *" — это 10:09 по Барселоне летом.
  #
  # Минута 9, а не 0: нулевая минута часа — самое загруженное время у
  # GitHub, туда ставит расписания большинство репозиториев, и запуски там
  # чаще опаздывают. С 04.10.2026 оба наших расписания запускались на 4–9
  # часов позже крона (замеры — decisions_drafts.md, 2026-10-16).
  #
  # 25.10.2026 Барселона переходит на зимнее время (UTC+1). С этого дня
  # строку надо поменять на "9 9 * * *", чтобы дайджест остался в 10:09
  # по местному; иначе он начнёт приходить в 09:09.
  schedule:
    - cron: "9 8 * * *"
  # Запуск вручную кнопкой на вкладке Actions — и от внешнего триггера
  # (cron-job.org), который дёргает тот же workflow_dispatch через API.
  #
  # Дайджест — раз в день: если сегодня он уже был, бот выходит, ничего не
  # отправив (notify/telegram.py, digest_done_today). Галочка force — для
  # ручного повтора в тот же день; триггер её не ставит, по умолчанию false.
  workflow_dispatch:
    inputs:
      force:
        description: "Отправить, даже если сегодня дайджест уже был"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest

    # Общие для всех шагов, как в collect.yml: id проекта и путь к ключу.
    env:
      BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/key.json

    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Поставить Python
        uses: actions/setup-python@v7
        timeout-minutes: 5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        timeout-minutes: 10
        run: pip install -r requirements.txt

      # Секрет GCP_SA_KEY виден только этому шагу; остальные читают ключ из файла.
      - name: Положить ключ сервисного аккаунта
        timeout-minutes: 2
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > key.json

      # Без числа и без --catch-up: обычный прогон, не больше MAX_PER_RUN
      # вакансий. --catch-up в расписание не ставим — догоняющий прогон
      # разовый и запускается руками. --force — только с галочкой force.
      #
      # timeout-minutes: обычный прогон — пара минут; 20 — запас на повторы при
      # 429 и 5xx. Прервётся по таймауту — вакансии не пропадут: исход записан
      # только у отправленных, остальные уйдут в следующий раз.
      #
      # inputs.force у запуска по расписанию пуст — тогда флага нет.
      - name: Отправить дайджест в Telegram
        timeout-minutes: 20
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: python -m notify.telegram $FORCE_FLAG
