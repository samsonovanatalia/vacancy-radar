# Утренний сбор вакансий по расписанию — то, что заменяет нам сервер с Airflow.
# Отправка в Telegram — отдельный workflow digest.yml, в 08:00 UTC.
#
# Как читать этот файл:
#   on       — когда запускать
#   env      — переменные, общие для всех шагов задачи
#   steps    — по шагам, сверху вниз, как в терминале
#
# Секреты этого workflow (Settings → Secrets and variables → Actions):
#   GCP_SA_KEY      — ключ сервисного аккаунта Google Cloud
#   BQ_PROJECT      — id проекта в Google Cloud
#   ADZUNA_APP_ID   — сбор adzuna
#   ADZUNA_APP_KEY  — сбор adzuna
#   GEMINI_API_KEY  — обогащение
# Добавляешь шаг, которому нужен новый ключ, — заведи секрет, допиши его в
# этот список и в env шага. Незаданный секрет приходит пустой строкой, и
# ночной прогон упадёт.

name: collect

on:
  # cron в UTC. 06:00 UTC = 08:00 в Барселоне летом.
  # Формат: минута час день месяц день_недели
  schedule:
    - cron: "0 6 * * *"
  # Позволяет запустить вручную кнопкой на вкладке Actions — удобно для отладки.
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    # Общие для всех шагов: id проекта и путь к ключу нужны каждому шагу,
    # который ходит в BigQuery, — загрузке, dbt, скачиванию страниц, обогащению.
    # Раньше они задавались в каждом шаге отдельно, и новый шаг легко было
    # оставить без них. Секреты, которые нужны одному шагу (ключи Adzuna,
    # Gemini, сам ключ сервисного аккаунта), — только в env своего шага: чем
    # меньше шагов видят ключ, тем меньше мест, где он может утечь.
    env:
      BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/key.json

    # timeout-minutes у каждого шага — с запасом в несколько раз от обычной
    # длительности (по прогону 15.09.2026). Без него зависший шаг держал бы
    # раннер до лимита задачи по умолчанию — 6 часов.
    steps:
      # v7 обеих actions работают на Node.js 24; v4 и v5 — на Node.js 20,
      # который GitHub объявил устаревшим и выводил об этом предупреждение.
      - name: Забрать код репозитория
        uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Поставить Python
        uses: actions/setup-python@v7
        timeout-minutes: 5
        with:
          python-version: "3.11"

      # Обычно полминуты.
      - name: Установить зависимости
        timeout-minutes: 10
        run: pip install -r requirements.txt

      # --- 1. Сбор из источников ---
      #
      # if: !cancelled() у каждого шага отсюда и до конца — то же правило,
      # что у третьей сборки dbt (см. комментарий у неё): упавший шаг не
      # останавливает остальные, но задача остаётся красной, и сбой виден.
      # Без условия GitHub пропускает ВСЕ шаги после упавшего: сломайся
      # один источник — не собрались бы и не загрузились остальные, не
      # пересобрались бы витрины, и утром не было бы дайджеста.
      # Условие стоит у всех источников, а не только у manfred: иначе
      # его сбой всё равно остановил бы шаги после него.

      - name: Собрать вакансии (arbeitnow)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: python -m collectors.arbeitnow

      - name: Собрать вакансии (remoteok)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: python -m collectors.remoteok

      # У adzuna, в отличие от остальных, есть ключи. Они подставляются
      # только на время шага: в логах вместо значения будет ***.
      # Обычно полторы минуты: 12 поисковых запросов и повторы при сбоях.
      - name: Собрать вакансии (adzuna)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m collectors.adzuna

      # Manfred — публичный API без ключа. Около двух минут: список офферов
      # одним запросом, потом ~60 карточек дата-ролей с паузой в секунду.
      - name: Собрать вакансии (manfred)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: python -m collectors.manfred

      # remotive отключён: публичный API отдаёт всего 17 вакансий на весь рынок
      # и игнорирует параметр category, ни одной data-вакансии в выдаче нет.
      # Код коллектора и таблица в BigQuery остаются — если API починят,
      # достаточно вернуть сюда шаги сбора и загрузки.
      #
      # - name: Собрать вакансии (remotive)
      #   timeout-minutes: 10
      #   run: python -m collectors.remotive

      # --- 2. Загрузка в BigQuery ---

      # Ключ сервисного аккаунта кладём в файл один раз, отдельным шагом: его
      # читают все следующие шаги по пути из GOOGLE_APPLICATION_CREDENTIALS.
      # Сам секрет GCP_SA_KEY виден только этому шагу.
      # printf '%s' безопаснее echo: не ломается на кавычках внутри ключа
      # и не разворачивает escape-последовательности.
      - name: Положить ключ сервисного аккаунта
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > key.json

      - name: Загрузить arbeitnow в BigQuery
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python -m load.to_bigquery arbeitnow

      - name: Загрузить remoteok в BigQuery
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python -m load.to_bigquery remoteok

      # Ключи Adzuna здесь уже не нужны: загрузчик читает готовый файл
      # data/raw_adzuna.jsonl и в источник не ходит.
      - name: Загрузить adzuna в BigQuery
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python -m load.to_bigquery adzuna

      - name: Загрузить manfred в BigQuery
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python -m load.to_bigquery manfred

      # - name: Загрузить remotive в BigQuery
      #   timeout-minutes: 5
      #   run: python -m load.to_bigquery remotive

      # --- 3. Витрины, страницы, обогащение ---
      #
      # dbt build здесь вызывается ТРИ раза, и это намеренно. Не объединять
      # и не убирать «лишний».
      #
      # Скачивание страниц и обогащение берут кандидатов и текст из витрин —
      # таблиц, которые обновляет только dbt build. Каждому шагу нужен
      # результат предыдущего:
      #   1. dbt build — решает, кто кандидат на обогащение: сегодняшние
      #      вакансии проходят правила без модели (mart_enrichment_candidates),
      #      и из кандидатов fetch.adzuna_pages берёт вакансии Adzuna;
      #   2. fetch.adzuna_pages — полный текст страниц Adzuna и коды ответа в raw;
      #   3. dbt build — текст страниц попадает в description_best таблицы
      #      mart_vacancies_scored, снятые вакансии (код 404) выпадают из
      #      кандидатов, а у скачанных появляется is_ready_for_enrichment;
      #   4. enrich.with_gemini — берёт готовых кандидатов и description_best
      #      из mart_enrichment_candidates;
      #   5. dbt build — собирает витрины с новым текстом и ответами модели:
      #      баллы, правила по языкам и резидентству, очередь для digest.yml.
      # Без сборки 3 вакансии Adzuna, скачанные в этот прогон, не дошли бы до
      # модели в этот день: без страницы они ещё не готовы к обогащению
      # (обрывок в 500 символов модели не отправляем). Снятые
      # вакансии вдобавок зря съели бы квоту модели.
      #
      # dbt стоит из requirements.txt (dbt-bigquery==1.12.0) — отдельно
      # ставить не нужно, иначе версия окажется прописана в двух местах.
      #
      # --project-dir  — где лежит dbt_project.yml и папка models
      # --profiles-dir — где лежит profiles.yml с подключением к BigQuery
      # По умолчанию dbt ищет профиль в ~/.dbt/ — на раннере такой папки нет,
      # поэтому показываем ему нашу.
      #
      # build = run + test: сначала пересобирает модель, сразу проверяет её
      # тестами и только потом идёт к следующей. Если тест упал — дальше
      # по цепочке не пойдёт, и битые данные не доедут до marts.
      #
      # Обычно сборка идёт полминуты; 15 минут — запас на медленный BigQuery.

      - name: dbt build 1 из 3 — подборка из сегодняшних вакансий
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          dbt build \
            --project-dir dbt_radar \
            --profiles-dir dbt_radar

      # Полный текст вакансий Adzuna со страниц сайта: API обрезает описание
      # на 500 символах. Ключи Adzuna не нужны — скрипт ходит на страницы по
      # ссылкам, которые отдал API. Кандидаты — вакансии подборки без свежей
      # проверки (fetch/adzuna_pages.py, RECHECK_AFTER_DAYS).
      #
      # timeout-minutes — страховка: обычный прогон идёт несколько минут
      # (до 60 страниц, пауза 3 секунды, 8 минут 15.09.2026), а при
      # недоступном сайте повторы по каждой странице тянулись бы часами.
      #
      # continue-on-error: сбой скачивания не должен оставить без дайджеста.
      # Например, если сайт ответит 403 на все запросы, скрипт завершится с
      # кодом 1 — шаг будет отмечен в логе как упавший, но следующие шаги
      # отработают по описаниям из API.
      - name: Скачать полный текст вакансий Adzuna
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        continue-on-error: true
        run: python -m fetch.adzuna_pages

      - name: dbt build 2 из 3 — текст скачанных страниц в витринах
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          dbt build \
            --project-dir dbt_radar \
            --profiles-dir dbt_radar

      # Обогащение языковой моделью: дописывает ответы Gemini в
      # raw.llm_enrichment. Нужны оба доступа: BigQuery — найти вакансии и
      # записать ответы, Gemini — спросить модель.
      #
      # timeout-minutes — грубая страховка поверх предохранителя в скрипте
      # (MAX_CONSECUTIVE_FAILURES): если он не сработает из-за ошибки в нём
      # самом, GitHub прервёт шаг через 30 минут, а не через 6 часов.
      # Обычный прогон короче: ~7 секунд на вакансию, 2.4 минуты 15.09.2026;
      # при потолке 100 кандидатов — около 13 минут.
      - name: Обогатить вакансии через Gemini
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m enrich.with_gemini

      # if: !cancelled() — сборка идёт, даже если обогащение упало. Упасть
      # оно может не по нашей вине: 22.09.2026 Gemini весь день отвечал 503
      # «high demand». Без условия GitHub пропускает все шаги после
      # упавшего, и очередь дайджеста не пересобралась бы — хотя собрать её
      # можно и на вчерашних ответах модели: вакансии без свежего ответа
      # просто подождут (awaiting_language_check) или пойдут без полей модели.
      #
      # Почему не continue-on-error, как у скачивания страниц выше. Тот
      # превращает сбой шага в успех, и вся задача становится зелёной. Здесь
      # так нельзя: упавшее обогащение должно быть видно — задача остаётся
      # красной, придёт письмо. Условие меняет только одно: упавший шаг
      # больше не останавливает то, что может работать без него.
      #
      # !cancelled(), а не always(): always() запустил бы сборку и после
      # ручной отмены задачи, а отменяют её как раз затем, чтобы
      # остановить всё. Таймаут шага отменой не считается — это сбой,
      # и сборка после него пойдёт.
      #
      # Цена: сборка запустится и после сбоя более ранних шагов — сбора или
      # загрузки в BigQuery. Это безопасно: dbt соберёт витрины на том, что
      # уже лежит в raw, то есть на вчерашних вакансиях.
      - name: dbt build 3 из 3 — ответы модели, баллы и очередь на отправку
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          dbt build \
            --project-dir dbt_radar \
            --profiles-dir dbt_radar
